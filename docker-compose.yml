services:
  postgres:
    image: postgres:16-alpine
    container_name: llm-xai-postgres
    environment:
      POSTGRES_DB: llm_xai
      POSTGRES_USER: llm_xai_user
      POSTGRES_PASSWORD: llm_xai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    container_name: llm-xai-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data: